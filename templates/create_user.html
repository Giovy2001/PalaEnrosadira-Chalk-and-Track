{% extends "base.html" %}
{% block title %}Chalk &amp; Track - Crea profilo{% endblock %}
{% block styles %}
<link rel="stylesheet" href="/static/css/input.css">
<link rel="stylesheet" href="/static/css/home/profile.css">
{% endblock %}
{% block content %}
<section class="profile-create-section">
  <div class="username-container">
    <p class="cell-title user-title">Nome utente</p>
    <p class="form-hint">Scegli il nome con cui saranno firmati i tuoi blocchi.</p>

    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

    <form method="POST">
      <input type="text" name="username-input" id="usernameInput" class="username-input"
             placeholder="Scrivi il tuo nome" value="{{ username or '' }}" required maxlength="40">
      <div class="controls">
        <button class="default-button" type="submit">Crea profilo utente</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
